site_name: UMC Documentation
site_description: Official documentation for Universal Minecraft Core.
site_url: https://fps1024.github.io/UMC/
repo_url: https://github.com/FPS1024/UMC
repo_name: FPS1024/UMC

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_docs.py

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

nav:
  - Home: index.md
  - Getting Started:
      - User Guide: user-guide.md
      - Installation: install.md
  - Architecture:
      - Overview: architecture.md
  - Development:
      - Integration Guide: developer-guide.md
      - Rust SDK: getting-started/sdk.md
  - RPC:
      - JSON-RPC v1: protocols/rpc-v1.md
  - Project:
      - Legal and Privacy: legal-and-privacy.md
      - Release Policy: release.md
      - v0.1.0 Release Notes: releases/v0.1.0.md
