name: Services

on:
  push:
    branches:
      - main
    paths:
      - "services/**"
      - ".github/workflows/services.yml"
  pull_request:
    paths:
      - "services/**"
      - ".github/workflows/services.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth:
    name: Auth service
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: umc_auth
          POSTGRES_USER: umc_auth
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U umc_auth -d umc_auth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: services/auth
    env:
      TEST_DATABASE_URL: "host=127.0.0.1 port=5432 user=umc_auth dbname=umc_auth sslmode=disable"
      PGPASSWORD: testpassword
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: services/auth/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l cmd)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build container image
        run: docker build -t umc-auth:ci .

      - name: Export image
        run: |
          docker save umc-auth:ci | gzip -9 > umc-auth-image.tar.gz
          sha256sum umc-auth-image.tar.gz > umc-auth-image.tar.gz.sha256

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: umc-auth-image
          path: |
            services/auth/umc-auth-image.tar.gz
            services/auth/umc-auth-image.tar.gz.sha256
          retention-days: 7
