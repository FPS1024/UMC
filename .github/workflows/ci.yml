name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --all -- --check

  msrv:
    name: Minimum Rust version (1.89)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo check --workspace --locked

  test:
    name: Rust workspace tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Run workspace tests
        run: cargo test --workspace --locked

  auth:
    name: Auth service (Go)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: umc_auth
          POSTGRES_USER: umc_auth
          POSTGRES_PASSWORD: devpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U umc_auth -d umc_auth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/auth/go.mod
          cache-dependency-path: services/auth/go.sum
      - name: Vet and test
        working-directory: services/auth
        env:
          TEST_DATABASE_URL: host=127.0.0.1 port=5432 user=umc_auth dbname=umc_auth sslmode=disable
          PGPASSWORD: devpassword
        run: |
          go vet ./...
          go test ./...

  web:
    name: Auth web panel
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/auth/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/auth/web/package-lock.json
      - run: npm ci
      - run: npm run build

  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Checkout documentation for release package
        run: git clone --depth 1 https://github.com/UMC-Community/Docs.git docs-source
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Build all workspace packages
        run: cargo build --workspace --locked --release --target x86_64-unknown-linux-gnu
      - name: Assemble Linux archive and checksum
        shell: bash
        run: |
          package_dir="dist/umc-linux-x86_64"
          mkdir -p "$package_dir"
          cp target/x86_64-unknown-linux-gnu/release/umc "$package_dir/"
          cp target/x86_64-unknown-linux-gnu/release/umcd "$package_dir/"
          cp LICENSE README.md "$package_dir/"
          cp docs-source/en/guide/user-guide.md "$package_dir/INSTALL.md"
          tar -C dist -czf dist/umc-linux-x86_64.tar.gz umc-linux-x86_64
          sha256sum dist/umc-linux-x86_64.tar.gz > dist/umc-linux-x86_64.tar.gz.sha256
      - name: Upload Linux release candidate
        uses: actions/upload-artifact@v6
        with:
          name: umc-linux-x86_64
          path: |
            dist/umc-linux-x86_64.tar.gz
            dist/umc-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
