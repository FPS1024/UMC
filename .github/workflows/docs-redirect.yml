name: Legacy documentation redirect

# The documentation site now lives in UMC-Community/Docs at /Docs/.
# This workflow replaces the old pages at /UMC/ with redirects so existing
# links continue to reach the current documentation.

on:
  push:
    branches: [main]
    paths:
      - "docs-redirect/**"
      - ".github/workflows/docs-redirect.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Upload redirect pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
