name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-linux:
    name: Publish Linux x86_64 GNU
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - name: Verify tag matches workspace version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; packages=json.load(sys.stdin)["packages"]; print(next(p["version"] for p in packages if p["name"] == "umc"))')"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version $tag_version does not match Cargo version $package_version" >&2
            exit 1
          fi
      - name: Build release binaries
        run: cargo build --workspace --locked --release --target x86_64-unknown-linux-gnu
      - name: Package Linux release and checksum
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive_base="umc-v${version}-linux-x86_64-gnu"
          package_dir="dist/${archive_base}"
          mkdir -p "$package_dir"
          cp "target/x86_64-unknown-linux-gnu/release/umc" "$package_dir/"
          cp "target/x86_64-unknown-linux-gnu/release/umcd" "$package_dir/"
          cp LICENSE README.md "$package_dir/"
          cp docs/guide/user-guide.md "$package_dir/INSTALL.md"
          tar -C dist -czf "dist/${archive_base}.tar.gz" "$archive_base"
          cd dist
          sha256sum "${archive_base}.tar.gz" > "${archive_base}.tar.gz.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          "dist/umc-v${GITHUB_REF_NAME#v}-linux-x86_64-gnu.tar.gz"
          "dist/umc-v${GITHUB_REF_NAME#v}-linux-x86_64-gnu.tar.gz.sha256"
          --repo "${GITHUB_REPOSITORY}"
          --title "UMC ${GITHUB_REF_NAME}"
          --notes-file "docs/releases/v${GITHUB_REF_NAME#v}.md"
          --verify-tag
          --latest
